[tool.poetry]
name = "reflex-ddns-auth"
version = "0.1.0"
description = "Shared SSO AuthState for Reflex apps on *.reflex-ddns.com"
authors = ["Milo Chen <milo_chen@mail2000.com.tw>"]
packages = [{include = "reflex_ddns_auth"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
reflex = ">=0.6"
PyJWT = ">=2.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
